# XcodeGen spec for the iPhone app — the source of truth for the project.
#
# The .xcodeproj is committed only because Xcode Cloud needs to find a project
# and a shared scheme in the repo; it is regenerated from this file by
# ./ios/build.sh (and by ci_scripts/ci_post_clone.sh on Xcode Cloud), so
# never edit it by hand.

name: FantasyAgent
options:
  bundleIdPrefix: dev.fantasy-agent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Signing lives in Local.xcconfig, which build.sh generates and .gitignore
# excludes. A Team ID identifies an Apple developer account, so it is detected
# from the keychain (or $DEVELOPMENT_TEAM) rather than committed here — that
# also keeps the project usable by anyone else who clones it.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  FantasyAgent:
    type: application
    platform: iOS
    sources:
      - path: FantasyAgent
        excludes:
          - "**/*.h"
      - path: FantasyAgent/Core/sa_ffi.h
        buildPhase: none
      - path: FantasyAgent/FantasyAgent-Bridging-Header.h
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fantasy-agent.ios
        # iPhone-only: keeps App Review (and the screenshot requirement) off iPad.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Let Xcode synthesise Info.plist from the INFOPLIST_KEY_* values
        # below, so there is no plist to keep in sync by hand.
        GENERATE_INFOPLIST_FILE: YES
        # Both come from Local.xcconfig, which build.sh writes: the version
        # from ios/VERSION, the build number from the commit count (or the
        # Xcode Cloud build number on CI).
        MARKETING_VERSION: "$(FA_VERSION)"
        CURRENT_PROJECT_VERSION: "$(FA_BUILD)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fantasy Agent
        # Dark-only, matching the desktop app's palette.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # The app only uses HTTPS/TLS, which is exempt. Declaring it here stops
        # App Store Connect asking about export compliance on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: FantasyAgent/FantasyAgent-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/FantasyAgent/Core
        # Rust staticlibs, one per platform. Built by ./ios/build.sh.
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/build/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - -lsa_ffi
          # rustls needs these for TLS and the system trust store.
          - -framework
          - Security
          - -framework
          - CoreFoundation
          - -framework
          - SystemConfiguration
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

# An explicit scheme is written to xcshareddata, which Xcode Cloud requires;
# XcodeGen's implicit per-target schemes are not shared.
schemes:
  FantasyAgent:
    build:
      targets:
        FantasyAgent: all
    run:
      config: Debug
    archive:
      config: Release
